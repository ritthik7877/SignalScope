[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-signalscope"
version = "0.1.0"
description = "Inspect, trace, and report Django signal receivers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Django>=4.2"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-django>=4.5"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["signalscope*"]
exclude = ["tests*", "demo_project*"]

[tool.setuptools.package-data]
signalscope = ["templates/signalscope/*.html"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo_project.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
